<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Banking Management System</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}" />
  </head>
  <body>
      <body>
        <div class="dashboard">
          <div class="sidebar">
            <h1>🏦 Banking System</h1>

            <button id="homeBtn">🏠 Home</button>

            <button id="openAccountBtn">👤 Open Account</button>

            <button id="depositBtn">💰 Deposit</button>

            <button id="withdrawBtn">💸 Withdraw</button>

            <button id="balanceBtn">📄 Balance Enquiry</button>

            <button id="transferBtn">🔄 Fund Transfer</button>

            <button id="loanBtn">💳 Loan</button>

            <button id="statementBtn">📜 Mini Statement</button>

            <button id="interestBtn">📈 Interest</button>
          </div>


          <div class="content">
            <div id="home" class="section active">

    <h2>🏦 Banking Management System</h2>

    <p>Welcome to Banking Management System</p>

    <p>Select any option from the left menu.</p>

</div>

            
            
            <!-- Home Page -->

            <div id="openAccount" class="section">
              <h2>Open New Account</h2>

              <form id="accountForm">
                <label>Customer Name</label>
                <input
                  type="text"
                  id="customerName"
                  placeholder="Enter Customer Name"
                  required />

                <label>Mobile Number</label>
                <input
                  type="text"
                  id="mobile"
                  placeholder="Enter Mobile Number"
                  required />

                <label>Address</label>
                <input
                  type="text"
                  id="address"
                  placeholder="Enter Address"
                  required />

                <label>Account Type</label>
                <select id="accountType">
                  <option value="Saving">Saving</option>
                  <option value="Current">Current</option>
                </select>

                <label>Opening Balance</label>
                <input
                  type="number"
                  id="openingBalance"
                  placeholder="Enter Opening Balance"
                  required />

                <button type="submit">Open Account</button>
              </form>
            </div>

            <div id="deposit" class="section">
              <h2>Deposit Money</h2>

              <div class="form-box">
                <label>Account Number</label>

                <input
                  type="number"
                  id="depositAccount"
                  placeholder="Enter Account Number" />

                <label>Deposit Amount</label>

                <input
                  type="number"
                  id="depositAmount"
                  placeholder="Enter Deposit Amount" />

                <button onclick="deposit()">Deposit Money</button>
              </div>
            </div>

            <div id="withdraw" class="section">
              <h2>Withdraw Money</h2>

            <div class="form-box">
              <label>Account Number</label>

              <input
                type="number"
                id="withdrawAccount"
                placeholder="Enter Account Number" />

              <label>Withdraw Amount</label>

              <input
                type="number"
                id="withdrawAmount"
                placeholder="Enter Withdraw Amount" />

              <button onclick="withdraw()">Withdraw Money</button>
            </div>
          </div>

            

          
            
            <div id="balance" class="section">

    <h2>Balance Enquiry</h2>

    <div class="form-box">

        <label>Account Number</label>

        <input
            type="number"
            id="balanceAccount"
            placeholder="Enter Account Number">

        <button onclick="checkBalance()">
            Check Balance
        </button>

        <div id="balanceResult"></div>

    </div>

</div>

<div id="transfer" class="section">

    <h2>Fund Transfer</h2>

    <div class="form-box">

        <label>From Account Number</label>

        <input
            type="number"
            id="fromAccount"
            placeholder="Enter Sender Account Number">

        <label>To Account Number</label>

        <input
            type="number"
            id="toAccount"
            placeholder="Enter Receiver Account Number">

        <label>Transfer Amount</label>

        <input
            type="number"
            id="transferAmount"
            placeholder="Enter Transfer Amount">

        <button onclick="transferMoney()">
            Transfer Money
        </button>

    </div>

</div>

<div id="loan" class="section">

    <h2>Loan Management</h2>

    <div class="form-box">

        <label>Account Number</label>

        <input
            type="number"
            id="loanAccount"
            placeholder="Enter Account Number">

        <label>Loan Amount</label>

        <input
            type="number"
            id="loanAmount"
            placeholder="Enter Loan Amount">

        <button onclick="applyLoan()">
            Apply Loan
        </button>

    </div>

</div>




            <div id="statementSection" class="section">
              <h2>Mini Statement</h2>

              <div class="form-box">
                <label>Account Number</label>

                <input
                  type="number"
                  id="statementAccount"
                  placeholder="Enter Account Number" />

                <button onclick="showStatement()">Show Statement</button>

                <div id="statement"></div>
            </div>

            <div id="statementSection" class="section"></div>

            <div id="interest" class="section">
              <h2>Interest Calculation</h2>

              <div class="form-box">
                <label>Account Number</label>

                <input
                  type="number"
                  id="interestAccount"
                  placeholder="Enter Account Number" />

                <button onclick="calculateInterest()">
                  Calculate Interest
                </button>

                <div id="interestResult"></div>
              </div>
          </div>
        </div>

        <script src="{{ url_for('static', filename='script.js') }}"></script>
      </body>
    </body>
  </body>
</html>
